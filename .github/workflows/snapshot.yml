name: daily-score-snapshot
on:
  schedule:
    - cron: '20 7 * * 1-5'   # UTC 07:20 = 北京时间 15:20（收盘后）；节假日运行会覆盖同日数据，幂等无害
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: compute daily scores
        run: node scripts/snapshot.mjs
      - name: commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "data: daily score snapshot"
          git push
