name: daily-score-snapshot
on:
  schedule:
    - cron: '20 7 * * 1-5'   # UTC 07:20 = 北京时间 15:20（收盘后）；节假日运行会覆盖同日数据，幂等无害
    - cron: '20 9 * * 1-5'   # UTC 09:20 = 北京时间 17:20 兜底（GitHub cron 常延迟 2.5h+，实测 08-06/08-07 均晚点；同日幂等覆盖）
  workflow_dispatch:

permissions:
  contents: write

# v4.1：workflow 级并发保护——双 cron 或手动触发重叠时排队而非并行，避免 push 竞争
concurrency:
  group: daily-score-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: compute daily scores
        run: node scripts/snapshot.mjs
      # v4.1：写入后、提交前验证——JSON/schema/口径一致性/隐私模式；validate-repo 任一 FAIL 即中止提交
      - name: validate before commit
        run: |
          node scripts/validate-repo.mjs
          git diff --check
      - name: commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: daily score snapshot"
            git pull --rebase origin main
            git push
          fi
